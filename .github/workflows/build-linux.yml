name: Release Linux

# Builds the Nyora Compose Desktop app for Linux and packages it for the two
# major package families — Debian/Ubuntu (.deb) and Fedora/RHEL (.rpm) — plus a
# distro-agnostic portable .tar.gz (bundled JRE, runs anywhere with glibc), for
# both x86_64 and arm64. The artifacts are published to a GitHub Release.
#
# The :shared module compiles the Kotatsu engine from the private nyora-shared
# submodule, so checkout must be recursive and use a PAT that can read it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # nyora-shared is a public submodule now — default GITHUB_TOKEN suffices.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # jpackage shells out to dpkg-deb/fakeroot for .deb and rpmbuild for .rpm.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils

      - name: Build .deb, .rpm and portable app image
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            :desktopApp:packageReleaseDeb \
            :desktopApp:packageReleaseRpm \
            :desktopApp:createReleaseDistributable

      - name: Stage artifacts (arch-named)
        run: |
          set -e
          OUT="desktopApp/build/compose/binaries/main-release"
          mkdir -p dist
          deb=$(find "$OUT/deb" -name '*.deb' | head -1)
          rpm=$(find "$OUT/rpm" -name '*.rpm' | head -1)
          [ -n "$deb" ] && cp "$deb" "dist/Nyora-linux-${{ matrix.arch }}.deb"
          [ -n "$rpm" ] && cp "$rpm" "dist/Nyora-linux-${{ matrix.arch }}.rpm"
          # Portable: tar the createReleaseDistributable app image (bundled JRE + launcher).
          appdir=$(find desktopApp/build/compose/binaries/main-release/app -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$appdir" ]; then
            tar -czf "dist/Nyora-linux-${{ matrix.arch }}-portable.tar.gz" -C "$(dirname "$appdir")" "$(basename "$appdir")"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nyora-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nyora for Linux ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: false
          body: |
            **Nyora for Linux ${{ github.ref_name }}** — Compose Desktop with a bundled Java runtime (no separate install needed).

            **Quick install (auto-detects your distro + CPU):**
            ```
            curl -fsSL https://raw.githubusercontent.com/Hasan72341/nyora-linux/main/install.sh | bash
            ```

            **Or download directly:**
            - Debian / Ubuntu / Mint / Pop!_OS — `Nyora-linux-x86_64.deb` (or `-arm64.deb`)
            - Fedora / RHEL / openSUSE — `Nyora-linux-x86_64.rpm` (or `-arm64.rpm`)
            - Any other distro — `Nyora-linux-x86_64-portable.tar.gz` (or `-arm64-portable.tar.gz`); extract and run `bin/Nyora`

            32-bit x86 isn't supported — Compose Desktop / JDK 17 are 64-bit only.
